name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite drives the real page in a real browser, because the ink
      # measurement only exists inside a canvas.
      - run: npx playwright install --with-deps chromium

      - run: npm test
